name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore Cowbania.sln
      - name: Build
        run: dotnet build Cowbania.sln --no-restore --configuration Release
      - name: Core tests
        run: dotnet run --project tests/Cowbania.Core.Tests --no-build --configuration Release
      - name: Host tests
        run: dotnet run --project tests/Cowbania.Host.Tests --no-build --configuration Release